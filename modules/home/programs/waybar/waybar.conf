{
  "layer": "top",
  "position": "top",
  "modules-left": [
    "niri/workspaces",
    "niri/window"
  ],
  "modules-center": [
    "custom/startmenu"
  ],
  "modules-right": [
    "pulseaudio",
    "cpu",
    "memory",
    "network",
    "tray",
    "clock",
    "custom/exit"
  ],
  "niri/workspaces": {
    "format": "{name}"
  },
  "niri/window": {
    "max-length": 40
  },
  "custom/startmenu": {
    "format": "",
    "on-click": "wofi --show drun",
    "tooltip": false
  },
  "pulseaudio": {
    "format": " {volume}%",
    "format-muted": "",
    "on-click": "pavucontrol"
  },
  "cpu": {
    "format": " {usage}%",
    "on-click": "ghostty -e btop"
  },
  "memory": {
    "format": " {}%",
    "on-click": "ghostty -e btop"
  },
  "network": {
    "format-ethernet": "NET {ipaddr}",
    "format-disconnected": "Offline"
  },
  "tray": {
    "spacing": 10
  },
  "clock": {
    "format": "{:%d.%m  %H:%M}"
  },
  "custom/exit": {
    "format": "⏻",
    "on-click": "niri msg action quit",
    "tooltip": false
  }
}
